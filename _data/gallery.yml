# Lab photo gallery — rendered by gallery.md
#
# One episode = one occasion, and it may hold as many photos as you like.
# Episodes render in file order, so newer ones go on top. The card shows the
# first photo as its cover.
#
#   - title:        shown on the card and in the viewer      (required)
#     date:         free text, shown under the title          (optional)
#     description:  one line, shown on the card               (optional)
#     caption:      one line, shown under the photos in the
#                   viewer — one per episode, not per photo   (optional)
#     photos:       just the image paths, from the repo root  (required)
#
# To add photos to an existing episode, add another `- image:` line under it.

